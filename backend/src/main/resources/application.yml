spring:
  # No default profile on purpose: development defaults live in application-local.yml and must be
  # requested explicitly (SPRING_PROFILES_ACTIVE=local). See config/ProductionSafetyCheck.
  application:
    name: die-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    # Runtime identity: least-privileged application role (no DDL).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/die}
    username: ${DB_APP_USER:postgres}
    password: ${DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    # Migrations run as the schema owner, never as the application role.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/die}
    user: ${DB_MIGRATOR_USER:die_migrator}
    password: ${DB_MIGRATOR_PASSWORD:}
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Roster uploads only. The parser enforces the same cap again (die.roster.max-bytes).
      max-file-size: 5MB
      max-request-size: 6MB
  session:
    # Schema is owned by Flyway (V2__identity.sql).
    jdbc:
      initialize-schema: never

die:
  auth:
    max-failed-per-identifier: 5
    max-failed-per-ip: 20
    throttle-window-minutes: 15
    # Distributed guessing cap per identifier across all addresses. Higher than the per-address cap so that a stranger
    # cannot lock a real user out with a few requests from another address.
    max-failed-per-identifier-any-address: 30
    attempt-retention-days: 7    # login_attempt rows older than this are purged hourly
    temp-credential-days: 14
    # Wrong guesses against one temporary credential (any address) before it is locked for lock-minutes. Higher than the
    # per-address throttle so ordinary typos never lock it; the lock lapses on its own (no admin reset needed).
    temp-credential-max-attempts: 20
    temp-credential-lock-minutes: 30
    email-verification-hours: 24
  roster:
    max-rows: 500          # temp credentials are Argon2-hashed per new student, so keep imports class-sized
    max-bytes: 5242880
    reissue-per-coordinator-per-hour: 30   # temporary-credential re-issues one coordinator may do per hour
    reissue-per-participant-per-hour: 3    # ... and per participant, whoever does it
    preview-retention-days: 7   # uncommitted (PREVIEW/CANCELLED) imports and their personal data are purged after this
    max-concurrent-commits: 2   # per API instance; each user can also run only one commit at a time
  credentials:
    # Bulk Argon2 hashing (roster commit) runs on its own small pool, outside any database transaction.
    hash-threads: 4        # ~16 MB of memory per running hash
    hash-queue: 1000
    hash-timeout-seconds: 120
  messaging:
    # RabbitMQ (own container). Disabled in tests that do not need a broker. The API starts without a broker and
    # reconnects on its own; unsent messages wait in the outbox table.
    enabled: ${DIE_MESSAGING_ENABLED:true}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
    consume-queues: die.test.results     # comma separated; consumer name for the inbox is the queue name
    prefetch: 10
    confirm-timeout-ms: 5000
    relay:
      enabled: true
      poll-ms: 500
      batch-size: 50
      lease-seconds: 30
      max-backoff-seconds: 30
      max-refusals: 10
  ops:
    # Operations / platform health (P0-VS05).
    max-heartbeat-age-seconds: 90        # a worker whose heartbeat is older is reported stale in GET /api/v1/ops/health
    workers:
      # Health endpoints of the workers, reachable from the API on the internal network. Blank = not monitored.
      orchestrator-url: ${DIE_OPS_ORCHESTRATOR_HEALTH_URL:}
      document-worker-url: ${DIE_OPS_DOCUMENT_WORKER_HEALTH_URL:}
    reaper:
      # Test jobs QUEUED/RUNNING for longer than this are failed (a lost result must not leave a job running forever).
      enabled: true
      interval-seconds: 60
      stale-after-seconds: ${DIE_OPS_STALE_JOB_SECONDS:900}
      batch-size: 100
  frontend-base-url: ${DIE_FRONTEND_BASE_URL:http://localhost:5173}
  mail:
    # Mail is queued in Postgres (mail_outbox) and sent by a background dispatcher (die.mail.dispatch=background, the
    # default; 'inline' is for tests).
    # smtp = real delivery (also set spring.mail.* and die.mail.from). log = print emails, including
    # activation/reset links, to the log: DEV ONLY, enabled by the local/test profiles.
    mode: ${DIE_MAIL_MODE:smtp}
    from: ${DIE_MAIL_FROM:no-reply@die.local}
  bootstrap:
    # First-run only: creates an admin when none exists. Remove after first start.
    admin-email: ${DIE_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${DIE_BOOTSTRAP_ADMIN_PASSWORD:}

server:
  port: 8080
  shutdown: graceful
  # native = Tomcat RemoteIpValve: request.getRemoteAddr() becomes the real client address, taken from
  # X-Forwarded-For only when the connection comes from a trusted (private-range) proxy, so a client
  # cannot spoof it. Login/reset throttling depends on this being correct.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Public endpoints expose the status word only: no hosts, credentials, versions or per-component breakdown.
      # Per-dependency detail is the ADMIN-only GET /api/v1/ops/health.
      show-details: never
      show-components: never
      # The broker contributor does not exist when messaging is disabled (tests); do not fail the start for it.
      validate-group-membership: false
      group:
        liveness:
          include: livenessState          # the process is alive; never depends on Postgres or RabbitMQ
        readiness:
          include: readinessState,db,broker

springdoc:
  api-docs:
    path: /v3/api-docs
    # Off by default so production does not publish the API surface anonymously; the local profile turns it on.
    enabled: false
  swagger-ui:
    enabled: false
    csrf:
      # Swagger UI reads the XSRF-TOKEN cookie and sends it as X-XSRF-TOKEN, so POST/PUT/DELETE "Try it out"
      # calls work. Call GET /api/v1/auth/csrf once first (it sets the cookie).
      enabled: true

logging:
  pattern:
    # Every log line carries the request id that is also returned as X-Request-Id and in error bodies (traceId).
    level: "%5p [%X{requestId:-}]"
