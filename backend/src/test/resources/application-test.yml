# Integration tests: capture mail in-process, no SMTP.
die:
  messaging:
    # Only the messaging integration tests switch the broker on (they start RabbitMQ with Testcontainers).
    enabled: false
  mail:
    mode: log
  bootstrap:
    # Never create an administrator at startup, whatever a developer's environment says.
    admin-email: ""
    admin-password: ""
  ops:
    reaper:
      # Tests call StaleJobReaper.reapOnce() themselves; a background pass would race their fixtures.
      enabled: false
