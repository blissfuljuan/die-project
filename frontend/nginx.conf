# Correlation id: keep a well-formed id sent by the caller, otherwise generate one here. The API honours it (RequestIdFilter),
# returns it as X-Request-Id and uses it as traceId in error bodies, and it is copied into outbox messages and worker logs.
map $http_x_request_id $die_request_id {
  default $http_x_request_id;
  ""      $request_id;
}

log_format die_json escape=json '{"timestamp":"$time_iso8601","service":"frontend","requestId":"$die_request_id","method":"$request_method",'
                                '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"durationSeconds":$request_time}';

server {
  access_log /dev/stdout die_json;
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API: browser cookies and CSRF work without CORS.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $die_request_id;
    proxy_http_version 1.1;
    # SSE (evaluation progress): do not buffer event streams.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA history fallback.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
