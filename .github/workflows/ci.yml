name: CI

# Needs no secrets. Everything runs on GitHub-hosted runners (Docker is available, which the Testcontainers tests need).
# Render deploys with `autoDeployTrigger: checksPass` (render.yaml): a commit is deployed only after the checks of this workflow
# are green. Mark the "CI green" job as a required status check on the main branch.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ static checks
  lint:
    name: Lint (Dockerfiles, shell, YAML, compose, Blueprint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        run: |
          # DL3008/DL3013/DL3018: packages are pinned through base-image digests and lock files; DL3059: readable layering;
          # DL3022: named build contexts (compose additional_contexts) are intentional; DL3066: numeric uid is set for workers.
          for f in backend/Dockerfile workers/*/Dockerfile frontend/Dockerfile infra/render/*.Dockerfile; do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning               --ignore DL3008 --ignore DL3013 --ignore DL3018 --ignore DL3059 --ignore DL3022 --ignore DL3066 - < "$f"
          done
      - name: shellcheck
        run: shellcheck --severity=warning scripts/smoke.sh infra/rabbitmq/die-entrypoint.sh infra/postgres/01-roles.sh
      - name: yamllint
        run: |
          pip install --quiet yamllint==1.35.1
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 220}, document-start: disable, truthy: {check-keys: false}}}' \
            render.yaml docker-compose.yml .github/workflows
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Blueprint structure
        run: python3 scripts/check-blueprint.py render.yaml

  # ------------------------------------------------------------------ database migrations
  flyway:
    name: Flyway migration check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: die
          POSTGRES_USER: die_migrator
          POSTGRES_PASSWORD: ci-migrator
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U die_migrator -d die" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Applied migrations are never edited
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$base" ] && ! echo "$base" | grep -Eq '^0+$' && git cat-file -e "$base" 2>/dev/null; then
            changed="$(git diff --name-status --diff-filter=MDR "$base" HEAD -- backend/src/main/resources/db/migration)"
            if [ -n "$changed" ]; then echo "Existing migrations were modified, deleted or renamed:"; echo "$changed"; exit 1; fi
          fi
          echo "no existing migration changed"
      - name: Create the application role like the Compose stack does
        env:
          POSTGRES_USER: die_migrator
          POSTGRES_DB: die
          POSTGRES_APP_USER: die_app
          POSTGRES_APP_PASSWORD: ci-app
          PGPASSWORD: ci-migrator
          PGHOST: localhost
        run: bash infra/postgres/01-roles.sh
      - name: Migrate an empty database, then validate
        run: |
          for cmd in migrate validate info; do
            docker run --rm --network host -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
              flyway/flyway:12-alpine -url=jdbc:postgresql://localhost:5432/die -user=die_migrator -password=ci-migrator \
              -cleanDisabled=true -validateMigrationNaming=true "$cmd"
          done
      - name: Migrating twice is a no-op
        run: |
          docker run --rm --network host -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:12-alpine -url=jdbc:postgresql://localhost:5432/die -user=die_migrator -password=ci-migrator migrate \
            | tee /dev/stderr | grep -q "Schema \"public\" is up to date"

  # ------------------------------------------------------------------ backend
  backend:
    name: Backend (unit + integration tests, Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        working-directory: backend
        run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports

  # ------------------------------------------------------------------ frontend
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ------------------------------------------------------------------ workers
  orchestrator:
    name: Java orchestrator (unit + broker tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        working-directory: workers/orchestrator
        run: mvn -B -ntp verify

  document-worker:
    name: Python document worker (pytest, real RabbitMQ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/document-analysis/pyproject.toml
      - name: Start RabbitMQ with the project topology
        run: |
          docker run -d --name rabbit -p 5672:5672 \
            -e RABBITMQ_DEFAULT_USER=die -e RABBITMQ_DEFAULT_PASS=ci-rabbit-password \
            -v "$PWD/infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro" \
            rabbitmq:3.13-management-alpine
          # Run the control commands as the broker's own user (-u rabbitmq). As root, rabbitmqctl/rabbitmq-diagnostics can
          # create a root-owned Erlang cookie while the node is still booting, which crashes the node (see
          # infra/rabbitmq/die-entrypoint.sh). A crashed node was why the tests saw "connection refused".
          ready=false
          for _ in $(seq 1 60); do
            if docker exec -u rabbitmq rabbit rabbitmq-diagnostics -q check_port_connectivity >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then echo "RabbitMQ did not start listening"; docker logs rabbit; exit 1; fi
          imported=false
          for _ in $(seq 1 30); do
            if docker exec -u rabbitmq rabbit rabbitmqctl -q import_definitions /etc/rabbitmq/definitions.json; then imported=true; break; fi
            sleep 2
          done
          if [ "$imported" != true ]; then echo "Importing the topology failed"; docker logs rabbit; exit 1; fi
      - name: pytest
        working-directory: workers/document-analysis
        env:
          RABBITMQ_TEST_URL: amqp://die:ci-rabbit-password@localhost:5672/%2F
        run: |
          pip install --quiet -e '.[test]'
          pytest -q

  # ------------------------------------------------------------------ whole stack
  compose-smoke:
    name: Compose stack smoke test + image scan
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      POSTGRES_MIGRATOR_PASSWORD: ci-migrator-password
      POSTGRES_APP_PASSWORD: ci-app-password
      RABBITMQ_PASSWORD: ci-rabbit-password
      DIE_BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.edu
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Generate the bootstrap administrator password (masked)
        run: |
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "DIE_BOOTSTRAP_ADMIN_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: Build and start the stack, wait for every health check
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Build the Render image variants (build context = repository root)
        run: |
          for d in api orchestrator document-worker rabbitmq; do
            docker build -q -f "infra/render/$d.Dockerfile" -t "render-$d" .
          done
      - name: Scan the application images (Trivy, CRITICAL with a fix available fails the build)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: die-api
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the other images
        run: |
          for image in die-orchestrator die-document-worker die-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet "$image"
          done
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------ gate
  ci-green:
    name: CI green
    if: always()
    needs: [lint, flyway, backend, frontend, orchestrator, document-worker, compose-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
