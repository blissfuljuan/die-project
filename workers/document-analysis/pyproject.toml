[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "die-document-worker"
version = "0.1.0"
description = "DIE document-analysis worker (P0-VS04: broker connectivity; DOCX/PDF parsing arrives in P2)"
requires-python = ">=3.12"
dependencies = [
    "pika==1.4.4",
    "jsonschema==4.23.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["broker: needs a real RabbitMQ (RABBITMQ_TEST_URL)"]
